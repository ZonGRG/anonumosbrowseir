# ============================================================
# Anonymus Browser — Build & Test Workflow
# ============================================================
# Запускается при пуше в dev/main и при PR
# ============================================================

name: Build & Test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  BUILD_CONFIGURATION: Release

jobs:
  # ============================================================
  # Линтинг и проверка
  # ============================================================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Python Formatting
        run: |
          pip install black ruff
          black --check python/
          ruff check python/

      - name: Check Commit Messages
        uses: wagoid/commitlint-github-action@v5
        with:
          configFile: '.commitlintrc.json'

  # ============================================================
  # Тесты криптографии
  # ============================================================
  test-crypto:
    name: Crypto Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install argon2-cffi cryptography

      - name: Run Tests
        run: python python/test_crypto.py

  # ============================================================
  # Сборка Windows x64
  # ============================================================
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install pyinstaller
          pip install argon2-cffi cryptography

      - name: Build Installer
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --name "AnonymusBrowserSetup_x64" `
            --hidden-import tkinter `
            --noconfirm `
            installer\installer_gui.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-build
          path: dist/AnonymusBrowserSetup_x64.exe

  # ============================================================
  # Проверка bezpieczeństwa
  # ============================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Run Bandit (Python Security)
        uses: PyCQA/bandit@master
        with:
          path: python/
          severity: high
          confidence: high

      - name: Check Secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  # ============================================================
  # Уведомление
  # ============================================================
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [test-crypto, build-windows, security]
    if: always()
    steps:
      - name: Send Status
        if: github.event_name == 'push'
        run: |
          echo "Build Status: ${{ needs.test-crypto.result }}"
          echo "Windows Build: ${{ needs.build-windows.result }}"
          echo "Security: ${{ needs.security.result }}"
